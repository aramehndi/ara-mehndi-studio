<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARA Mehndi Studio</title>

<style>

body {
  margin: 0;
  font-family: Arial;
  background: #0f2027;
  color: white;
}

/* NAVBAR */
.navbar {
  text-align: center;
  padding: 15px;
  background: black;
}

.navbar a {
  color: white;
  margin: 10px;
  text-decoration: none;
}

/* HEADER */
header {
  text-align: center;
  padding: 80px 20px;
}

/* THEMES */
.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.theme {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: gold;
  color: black;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.3s;
}

.theme:hover {
  transform: scale(1.1);
}

/* GALLERY */
.gallery img {
  width: 250px;
  border-radius: 10px;
  margin: 10px;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.05);
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <a href="#">Home</a>
  <a href="#">Gallery</a>
</div>

<!-- HEADER -->
<header>
  <h1>ARA Mehndi Studio</h1>
  <p>Arabic | Bridal | Mandala Mehndi Designs</p>
</header>

<!-- THEMES -->
<section>
  <h2>Themes</h2>
  <div class="container">

    <div class="theme" onclick="showGallery('arabic')">Arabic</div>
    <div class="theme" onclick="showGallery('bridal')">Bridal</div>
    <div class="theme" onclick="showGallery('mandala')">Mandala</div>

  </div>
</section>

<!-- GALLERY -->
<section id="gallerySection" style="display:none;">
  <h2 id="galleryTitle"></h2>

  <!-- ARABIC -->
  <div class="gallery" id="arabic" style="display:none;">
    <img src="arabic1.png">
    <img src="arabic2.png">
    <img src="arabic3.png">
    <img src="arabic4.png">
    <img src="arabic5.png">
  </div>

  <!-- BRIDAL -->
  <div class="gallery" id="bridal" style="display:none;">
    <img src="bridal1.png">
    <img src="bridal2.png">
    <img src="bridal3.png">
    <img src="bridal4.png">
    <img src="bridal5.png">
  </div>

  <!-- MANDALA -->
  <div class="gallery" id="mandala" style="display:none;">
    <img src="mandala1.png">
    <img src="mandala2.png">
    <img src="mandala3.png">
    <img src="mandala4.png">
    <img src="mandala5.png">
  </div>

</section>

<script>

function showGallery(type) {

  // Show section
  document.getElementById("gallerySection").style.display = "block";

  // Hide all galleries
  document.querySelectorAll(".gallery").forEach(g => {
    g.style.display = "none";
  });

  // Show selected
  document.getElementById(type).style.display = "block";

  // Title change
  document.getElementById("galleryTitle").innerText =
    type.charAt(0).toUpperCase() + type.slice(1) + " Designs";

  // Smooth scroll
  document.getElementById("gallerySection").scrollIntoView({
    behavior: "smooth"
  });
}

</script>

</body>
</html>
