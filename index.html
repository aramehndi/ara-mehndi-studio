<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARA Mehndi Studio</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f2027;
  color: white;
}

.navbar {
  text-align: center;
  padding: 15px;
  background: black;
}

header {
  text-align: center;
  padding: 80px 20px;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.theme {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: gold;
  color: black;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.gallery {
  display: none;
  text-align: center;
}

.gallery img {
  width: 250px;
  margin: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="navbar">Home | Gallery</div>

<header>
  <h1>ARA Mehndi Studio</h1>
  <p>Arabic | Bridal | Mandala Designs</p>
</header>

<!-- THEMES -->
<section>
  <h2 style="text-align:center;">Themes</h2>

  <div class="container">
    <div class="theme" onclick="showGallery('arabic')">Arabic</div>
    <div class="theme" onclick="showGallery('bridal')">Bridal</div>
    <div class="theme" onclick="showGallery('mandala')">Mandala</div>
  </div>
</section>

<!-- GALLERY -->
<section id="gallerySection" style="display:none; text-align:center;">
  <h2 id="title"></h2>

  <!-- Arabic -->
  <div id="arabic" class="gallery">
    <img src="arabic1.png">
    <img src="arabic2.png">
    <img src="arabic3.png">
    <img src="arabic4.png">
    <img src="arabic5.png">
  </div>

  <!-- Bridal -->
  <div id="bridal" class="gallery">
    <img src="bridal1.png">
    <img src="bridal2.png">
    <img src="bridal3.png">
    <img src="bridal4.png">
    <img src="bridal5.png">
  </div>

  <!-- Mandala -->
  <div id="mandala" class="gallery">
    <img src="mandala1.png">
    <img src="mandala2.png">
    <img src="mandala3.png">
    <img src="mandala4.png">
    <img src="mandala5.png">
  </div>

</section>

<script>

function showGallery(type) {

  // Show section
  document.getElementById("gallerySection").style.display = "block";

  // Hide all galleries
  document.querySelectorAll(".gallery").forEach(g => g.style.display = "none");

  // Show selected
  document.getElementById(type).style.display = "block";

  // Title set
  document.getElementById("title").innerText = type.toUpperCase() + " Designs";

  // Scroll
  document.getElementById("gallerySection").scrollIntoView({
    behavior: "smooth"
  });
}

</script>

</body>
</html>
