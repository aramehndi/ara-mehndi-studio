<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARA Mehndi Studio</title>

<meta name="google-site-verification" content="H4cj3xKG7XTY1owIFaOR3MZBUtjJAw4uKJRBhttdAhQ" />

<style>

body {
  margin: 0;
  font-family: 'Segoe UI';
  color: white;
  background: #0f2027;
  overflow-x: hidden;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

.navbar {
  text-align: center;
  padding: 15px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
}

.navbar a {
  color: white;
  margin: 10px;
  text-decoration: none;
}

header {
  text-align: center;
  padding: 80px 20px;
}

.btn {
  background: linear-gradient(45deg, green, lime);
  padding: 12px 25px;
  border-radius: 25px;
  color: white;
  text-decoration: none;
}

.card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  margin: 15px;
  padding: 20px;
  border-radius: 15px;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.theme {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: gold;
  color: black;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.gallery img {
  width: 250px;
  margin: 10px;
  border-radius: 10px;
  cursor: pointer;
}

#popup {
  position: fixed;
  display: none;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  justify-content: center;
  align-items: center;
}

#popup img {
  max-width: 90%;
}

.whatsapp, .instagram {
  position: fixed;
  bottom: 20px;
  padding: 12px;
  border-radius: 50%;
  color: white;
}

.whatsapp { right: 20px; background: green; }
.instagram { right: 80px; background: purple; }

#chatbox {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 260px;
  background: white;
  color: black;
  border-radius: 10px;
  display: none;
  padding: 10px;
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="navbar">
  <a href="#">Home</a>
  <a href="#price">Price</a>
</div>

<header>
  <h1>ARA Mehndi Studio</h1>
  <p>Premium Mehndi Designs in Ara</p>
  <br>
  <!-- ✅ FORM LINK ADDED -->
  <a href="https://docs.google.com/forms/d/e/1FAIpQLSdWl41M1TciholVwFBZcPsl4mUUyTX_LRwIx1Vmc8tEQy50Cg/viewform?usp=header" class="btn" target="_blank">Book Now</a>
</header>

<section class="card">
<h2 style="text-align:center;">Design Categories</h2>
<div class="container">
<div class="theme" onclick="show('arabic')">Arabic</div>
<div class="theme" onclick="show('bridal')">Bridal</div>
<div class="theme" onclick="show('mandala')">Mandala</div>
</div>
</section>

<section id="gallery" class="card" style="display:none;text-align:center;">
<h2 id="title"></h2>

<div id="arabic" class="gallery">
<img src="arabic1.png" onclick="zoom(this)">
<img src="arabic2.png" onclick="zoom(this)">
<img src="arabic3.png" onclick="zoom(this)">
<img src="arabic4.png" onclick="zoom(this)">
<img src="arabic5.png" onclick="zoom(this)">
</div>

<div id="bridal" class="gallery">
<img src="bridal1.png" onclick="zoom(this)">
<img src="bridal2.png" onclick="zoom(this)">
<img src="bridal3.png" onclick="zoom(this)">
<img src="bridal4.png" onclick="zoom(this)">
<img src="bridal5.png" onclick="zoom(this)">
</div>

<div id="mandala" class="gallery">
<img src="mandala1.png" onclick="zoom(this)">
<img src="mandala2.png" onclick="zoom(this)">
<img src="mandala3.png" onclick="zoom(this)">
<img src="mandala4.png" onclick="zoom(this)">
<img src="mandala5.png" onclick="zoom(this)">
</div>

</section>

<section id="price" class="card" style="text-align:center;">
<h2>Pricing</h2>
<p>Bridal Mehndi: ₹3000 - ₹8000</p>
<p>Full Hand: ₹500 - ₹1500</p>
<p>Arabic: ₹300 - ₹1000</p>
<p>Mandala: ₹100 - ₹500</p>
</section>

<section class="card">
<h2>Location</h2>
<iframe src="https://maps.google.com/maps?q=Ara%20Bihar&t=&z=13&output=embed" width="100%" height="250"></iframe>
</section>

<a href="https://wa.me/916200165825?text=I want mehndi booking" class="whatsapp">💬</a>
<a href="https://instagram.com/ara_mehndi_studio.01" class="instagram">📸</a>

<button onclick="chatToggle()" style="position:fixed;bottom:150px;right:20px;">Chat</button>

<div id="chatbox">
<p><b>Hi 👋</b></p>
<p>1. Price</p>
<p>2. Booking</p>
<p>3. Designs</p>
</div>

<div id="popup" onclick="this.style.display='none'">
<img id="popup-img">
</div>

<script>

function show(type){
document.getElementById("gallery").style.display="block";
document.querySelectorAll(".gallery").forEach(g=>g.style.display="none");
document.getElementById(type).style.display="block";
document.getElementById("title").innerText=type.toUpperCase();
}

function zoom(img){
document.getElementById("popup").style.display="flex";
document.getElementById("popup-img").src=img.src;
}

function chatToggle(){
let c=document.getElementById("chatbox");
c.style.display=c.style.display=="none"?"block":"none";
}

let canvas=document.getElementById("bg");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<50;i++){
particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach(p=>{
p.y+=0.5;
if(p.y>canvas.height) p.y=0;
ctx.fillStyle="white";
ctx.fillRect(p.x,p.y,2,2);
});
requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
